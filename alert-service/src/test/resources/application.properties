# ============================================================
#  TEST OVERRIDES
#  On the test classpath a second application.properties SHADOWS the
#  one from src/main/resources (they do not merge), so every setting
#  the application context needs (Kafka consumer/producer, alert
#  topics, mail) is repeated here. The suite runs without external
#  infrastructure:
#   - H2 in-memory database instead of MySQL (Flyway disabled)
#   - Kafka bootstrap servers are provided by @EmbeddedKafka
# ============================================================

spring.application.name=alert-service
server.port=0

# --- Kafka consumer -----------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=alert-service
# Read from the beginning so a freshly started consumer never misses a record
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=alertingEvent:com.pgs.kafka.event.AlertingEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.pgs.kafka.event

# --- Kafka producer (only used to republish to the dead-letter topic) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- Alert topics (centralized) ----------------------------------------
app.kafka.alerts.topic=energy-alerts
app.kafka.alerts.dlt-topic=energy-alerts-dlt

# Keep the listener stopped by default so plain @SpringBootTest cases
# (e.g. contextLoads) do not try to reach a broker. The Kafka
# integration test re-enables it through @SpringBootTest(properties = ...).
spring.kafka.listener.auto-startup=false

# --- Database (H2 instead of MySQL) ------------------------------------
spring.datasource.url=jdbc:h2:mem:alertdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

# --- Mail (creates the JavaMailSender bean; never connects in tests) ----
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false