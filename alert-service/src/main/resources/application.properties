spring.application.name=alert-service
server.port = 8084

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

#Kafka - consumer
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=alert-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=alertingEvent:com.pgs.kafka.event.AlertingEvent
# Trust the alert event package so JsonDeserializer accepts the type header sent by usage-service
spring.kafka.consumer.properties.spring.json.trusted.packages=com.pgs.kafka.event

# Kafka - producer (used only to republish to the dead-letter topic)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Alert topics (centralized here instead of hard-coding them in code)
app.kafka.alerts.topic=energy-alerts
app.kafka.alerts.dlt-topic=energy-alerts-dlt

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/home_energy_tracker_alert
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

# Mailpit SMTP Configuration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Springdoc OpenAPI / Swagger UI configuration
# The service exposes no REST endpoints of its own, so no group is registered.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.packages-to-scan=com.pgs.alert.service