services:

  # ============================================================
  #  MySQL
  # ============================================================
  mysql:
    image: mysql:8.3.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: home_energy_tracker
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/mysql
    healthcheck:
      # The application services wait for this before starting (see depends_on).
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -padmin --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  #  Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: user-service-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  #  Kafka (KRaft mode, single node)
  # ============================================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"   # Controller listener (internal)
      - "9094:9094"   # External listener (host machine)
    environment:
      # ---- KRaft Metadata & Node Identity ----
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_PROCESS_ROLES: 'broker,controller'

      # ---- Controller Quorum (Raft) ----
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # ---- Network Listeners ----
      KAFKA_LISTENERS: >
        PLAINTEXT://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:9094,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092,
        EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

      # ---- Single-Node Cluster Safety ----
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # ---- Broker Defaults ----
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1

    volumes:
      - ./docker/kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  #  Kafka UI (Kafbat)
  # ============================================================
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8070:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    restart: unless-stopped

  # ============================================================
  #  InfluxDB (time series database for energy usage data)
  # ============================================================
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8072:8086"          # 8072 en host → 8086 en contenedor
    environment:
      # ---- Setup inicial (solo se aplica la primera vez) ----
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: home-energy-tracker
      DOCKER_INFLUXDB_INIT_BUCKET: usage-bucket
      DOCKER_INFLUXDB_INIT_RETENTION: 1w
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-token
    volumes:
      - ./docker/influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  #  Mailpit (Servidor SMTP de pruebas y UI web)
  # ============================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Interfaz Web (UI)
      - "1025:1025"   # Puerto SMTP para recibir correos

  # ============================================================
  #  Keycloak
  # ============================================================
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0.1
    command: [ "start-dev", "--import-realm" ]
    environment:
      # NOTE: Keycloak 24 (Quarkus) no longer reads the legacy DB_VENDOR / DB_ADDR /
      # DB_DATABASE / DB_USER / DB_PASSWORD variables — those belonged to the WildFly
      # distribution (Keycloak <= 16) and are silently ignored here. This instance runs
      # on its embedded H2 database, persisted in the `keycloak-data` volume below.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8091:8080"
    volumes:
      # Realm / clients / users are seeded from these JSON files whenever the realm
      # does not exist yet (see docker/keycloak/realms/).
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
      # Keycloak stores its data (realm, clients, keys, sessions) under
      # /opt/keycloak/data. Without this volume that data lives in the container's
      # writable layer and is destroyed by `docker compose down` / `rm`.
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # Keycloak serves HTTP on 8080 inside the container. The image ships no curl,
      # so the check opens a TCP connection with bash's /dev/tcp.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ============================================================
  #  Prometheus (metrics scraping & time-series storage)
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # The whole directory is mounted so the scrape configuration can be switched
      # with PROMETHEUS_CONFIG_FILE (see .env.docker):
      #   prometheus.yml         -> targets on the host (host.docker.internal), default
      #   prometheus.docker.yml  -> targets on the Compose network (service names)
      - ./docker/prometheus/:/etc/prometheus/configs/:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/configs/${PROMETHEUS_CONFIG_FILE:-prometheus.yml}
      - --storage.tsdb.retention.time=5d
      - --web.enable-lifecycle
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ============================================================
  #  Grafana (dashboards over the Prometheus metrics)
  # ============================================================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# ============================================================
#  Application services (Compose profile: app)
# ============================================================
# Built from each service's Dockerfile:
#     docker compose --env-file .env.docker up -d --build
# They live behind the `app` profile, so a plain `docker compose up -d` keeps
# starting only the infrastructure (the usual workflow when the services are
# launched from the IDE).
# Every inter-service URL is overridden here with the Compose service name, so
# the same images would work in any other environment (Kubernetes, ECS, ...).
# The host ports are kept 1:1 with the service ports so postman.json keeps working.

  user-service:
    build:
      context: ./user-service
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: het/user-service:local
    container_name: user-service
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/home_energy_tracker_user
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    mem_limit: 640m
    restart: unless-stopped

  device-service:
    build:
      context: ./device-service
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: het/device-service:local
    container_name: device-service
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/home_energy_tracker_device
      REDIS_HOST: redis
    ports:
      - "8081:8081"
    mem_limit: 640m
    restart: unless-stopped

  ingestion-service:
    build:
      context: ./ingestion-service
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: het/ingestion-service:local
    container_name: ingestion-service
    profiles: ["app"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SIMULATION_ENDPOINT: http://ingestion-service:8082/api/v1/ingestion
    ports:
      - "8082:8082"
    mem_limit: 640m
    restart: unless-stopped

  usage-service:
    build:
      context: ./usage-service
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: het/usage-service:local
    container_name: usage-service
    profiles: ["app"]
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      device-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INFLUX_URL: http://influxdb:8086
      DEVICE_SERVICE_URL: http://device-service:8081/api/v1/device
      USER_SERVICE_URL: http://user-service:8080/api/v1/user
    ports:
      - "8083:8083"
    mem_limit: 640m
    restart: unless-stopped

  alert-service:
    build:
      context: ./alert-service
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: het/alert-service:local
    container_name: alert-service
    profiles: ["app"]
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MYSQL_URL: jdbc:mysql://mysql:3306/home_energy_tracker_alert
      SPRING_MAIL_HOST: mailpit
    ports:
      - "8084:8084"
    mem_limit: 640m
    restart: unless-stopped

  insight-service:
    build:
      context: ./insight-service
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: het/insight-service:local
    container_name: insight-service
    profiles: ["app"]
    depends_on:
      usage-service:
        condition: service_healthy
    extra_hosts:
      # Ollama is NOT part of this Compose file: it runs on the host machine.
      # host-gateway maps host.docker.internal to the host also on Linux.
      - "host.docker.internal:host-gateway"
    environment:
      USAGE_SERVICE_URL: http://usage-service:8083/api/v1/usage
      SPRING_AI_OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8085:8085"
    mem_limit: 640m
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      args:
        SKIP_TESTS: ${SKIP_TESTS:-true}
    image: het/api-gateway:local
    container_name: api-gateway
    profiles: ["app"]
    depends_on:
      keycloak:
        condition: service_healthy
      user-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      usage-service:
        condition: service_healthy
      insight-service:
        condition: service_healthy
    environment:
      # JWKS is fetched from inside the Compose network...
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/het-security-realm/protocol/openid-connect/certs
      # ...while clients keep obtaining their tokens from the public URL, whose
      # `iss` claim (http://localhost:8091/...) is not validated by the gateway.
      KEYCLOAK_ISSUER_URI: http://localhost:8091/realms/het-security-realm
      # Route targets: container names instead of localhost (see route/*Routes.java).
      USER_SERVICE_URI: http://user-service:8080
      DEVICE_SERVICE_URI: http://device-service:8081
      INGESTION_SERVICE_URI: http://ingestion-service:8082
      USAGE_SERVICE_URI: http://usage-service:8083
      INSIGHT_SERVICE_URI: http://insight-service:8085
    ports:
      - "9000:9000"
    mem_limit: 640m
    restart: unless-stopped

# ============================================================
#  Volumes
# ============================================================
volumes:
  db-data:
  kafka-data:
  grafana-data:
  prometheus-data:
  keycloak-data: