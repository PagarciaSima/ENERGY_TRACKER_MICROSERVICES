spring.application.name=usage-service
server.port = 8083

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

#Kafka - consumer
# Defaults target a stack running on the host (Kafka's external listener on :9094).
# docker-compose overrides it with KAFKA_BOOTSTRAP_SERVERS=kafka:9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=usage-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=energyUsageEvent:com.pgs.kafka.event.EnergyUsageEvent

#Kafka - producer
spring.kafka.template.default-topic=energy-alerts
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


#Influx DB Configuration
# 8072 is the port published by docker-compose on the host; inside the Compose network
# InfluxDB listens on its own port 8086 (INFLUX_URL=http://influxdb:8086).
influx.url=${INFLUX_URL:http://localhost:8072}
influx.token=my-token
influx.org=home-energy-tracker
influx.bucket=usage-bucket


device.service.url=${DEVICE_SERVICE_URL:http://localhost:8081/api/v1/device}
user.service.url=${USER_SERVICE_URL:http://localhost:8080/api/v1/user}

# Page size used when walking the paginated Device Service endpoints
# (GET /api/v1/device/user/{userId} returns a PageResponse envelope, not an array).
device.service.page-size=100

# Alert cooldown: after an alert is published for a user, further alerts for that
# user are suppressed during this many minutes. The state is kept IN MEMORY, so it
# is lost when the service restarts and it is not shared between instances.
app.alerting.cooldown-minutes=60

# Springdoc OpenAPI / Swagger UI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.packages-to-scan=com.pgs.usage.service
# Group the usage endpoints under a single 'usage' group
springdoc.group-configs[0].group=usage
springdoc.group-configs[0].paths-to-match[0]=/api/v1/usage/**