# ============================================================
#  Prometheus — scrape configuration for the Home Energy Tracker
# ============================================================
# The microservices run on the HOST machine (not inside Docker), so every
# target is reached through host.docker.internal. The mapping to the host
# gateway is declared in docker-compose.yml (extra_hosts).
# Each Spring Boot service exposes Micrometer metrics on /actuator/prometheus.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: home-energy-tracker
    env: local

scrape_configs:
  # ---- Prometheus itself (self-monitoring) ----
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ---- API Gateway (:9000) ----
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:9000']
        labels:
          application: api-gateway

  # ---- User Service (:8080) ----
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: user-service

  # ---- Device Service (:8081) ----
  - job_name: device-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          application: device-service

  # ---- Ingestion Service (:8082) ----
  - job_name: ingestion-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          application: ingestion-service

  # ---- Usage Service (:8083) ----
  - job_name: usage-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          application: usage-service

  # ---- Alert Service (:8084) ----
  - job_name: alert-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          application: alert-service

  # ---- Insight Service (:8085) ----
  - job_name: insight-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8085']
        labels:
          application: insight-service
