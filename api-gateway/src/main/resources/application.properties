spring.application.name=api-gateway
server.port=9000

# Actuator & Prometheus
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,prometheus
management.metrics.tags.application=${spring.application.name}

#Resilinece4j Properties
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=8
resilience4j.circuitbreaker.configs.default.failureRateThreshold=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true

# Timeout applied by the circuit breaker filter to every routed call. Resilience4j's
# default TimeLimiter timeout is 1 second, which is shorter than a chat-model call
# (1-6 s): every call to /api/v1/insight/** was cut, recorded as a failure and
# answered with the fallback. Keep it above the slowest downstream operation.
resilience4j.timelimiter.configs.default.timeout-duration=30s

#Keycloak
# JWKS endpoint used by the gateway to validate the JWT signature. This URL is resolved
# FROM the gateway, so inside Docker it must point to the Keycloak service
# (http://keycloak:8080); clients keep using the public URL (http://localhost:8091).
keycloak.auth.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8091/realms/het-security-realm/protocol/openid-connect/certs}
# This property name used to contain a comma (a typo), so Spring Boot never read it;
# it is now the dot-separated form. The JwtDecoder bean declared in SecurityConfig
# takes precedence over the auto-configured one and does not validate the `iss` claim,
# which is what lets the same image run both on the host and inside Docker.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8091/realms/het-security-realm}

# Downstream service base URIs used by the route definitions in com.pgs.api.gateway.route.
# Override them with the container names when the whole stack runs in Docker, e.g.
# USER_SERVICE_URI=http://user-service:8080.
user.service.uri=${USER_SERVICE_URI:http://localhost:8080}
device.service.uri=${DEVICE_SERVICE_URI:http://localhost:8081}
ingestion.service.uri=${INGESTION_SERVICE_URI:http://localhost:8082}
usage.service.uri=${USAGE_SERVICE_URI:http://localhost:8083}
insight.service.uri=${INSIGHT_SERVICE_URI:http://localhost:8085}

#Security
security.excluded.urls= /actuator/**, /swagger-ui.html, /swagger-ui/**, /docs/**, /v3/api-docs/**, /swagger-resources/**, /api-docs/**


#OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/docs/user-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Device Service
springdoc.swagger-ui.urls[1].url=/docs/device-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Ingestion Service
springdoc.swagger-ui.urls[2].url=/docs/ingestion-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=Insight Service
springdoc.swagger-ui.urls[3].url=/docs/insight-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=Usage Service
springdoc.swagger-ui.urls[4].url=/docs/usage-service/v3/api-docs