spring.application.name=ingestion-service
server.port = 8082

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

#Kafka
# Defaults target a stack running on the host (Kafka's external listener on :9094).
# docker-compose overrides it with KAFKA_BOOTSTRAP_SERVERS=kafka:9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.template.default-topic=energy-usage
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# Continuous simulation configuration
simulation.endpoint=${SIMULATION_ENDPOINT:http://localhost:8082/api/v1/ingestion}
simulation.requests-per-interval=10000
simulation.interval-ms=60000
simulation.parallel-threads=10

# Springdoc OpenAPI / Swagger UI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.packages-to-scan=com.pgs.ingestion.service
# Group the ingestion endpoints under a single 'ingestion' group
springdoc.group-configs[0].group=ingestion
springdoc.group-configs[0].paths-to-match[0]=/api/v1/ingestion/**