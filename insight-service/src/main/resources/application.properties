spring.application.name=insight-service
server.port=8085

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# Base URL of the Usage Service. Defaults to a host run; docker-compose overrides it
# with USAGE_SERVICE_URL=http://usage-service:8083/api/v1/usage.
usage.service.url = ${USAGE_SERVICE_URL:http://localhost:8083/api/v1/usage}

# Base URL of the Ollama server. Defaults to a host run; when this service runs inside
# Docker the container reaches the host instance through
# SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434.
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}

spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.init.pull-model-strategy=never

# Fail fast when Ollama is down. With the Spring AI defaults (10 attempts and an
# exponential backoff of 2s multiplied by 5 without a cap: 2s, 10s, 50s, 250s...)
# the HTTP request never completes, so the client hangs instead of getting an error.
# With the values below a dead Ollama is reported in ~1-2 seconds as a 503
# (see DependencyUnavailableException / GlobalExceptionHandler).
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=2s

# Springdoc OpenAPI / Swagger UI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.packages-to-scan=com.pgs.insight.service
# Group the insight endpoints under a single 'insight' group
springdoc.group-configs[0].group=insight
springdoc.group-configs[0].paths-to-match[0]=/api/v1/insight/**