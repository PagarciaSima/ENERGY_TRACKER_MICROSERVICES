spring.application.name=insight-service
server.port=8085

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

usage.service.url = http://localhost:8083/api/v1/usage

spring.ai.ollama.chat.options.model=deepseek-coder
spring.ai.ollama.init.pull-model-strategy=never

# Springdoc OpenAPI / Swagger UI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.packages-to-scan=com.pgs.insight.service
# Group the insight endpoints under a single 'insight' group
springdoc.group-configs[0].group=insight
springdoc.group-configs[0].paths-to-match[0]=/api/v1/insight/**